<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><title>立體牌桌連續性回歸測試</title><style>body{margin:0;background:#101f2a;color:#f3e5c7;font:12px monospace}pre{margin:0;padding:6px;white-space:pre-wrap}iframe{width:100%;height:calc(100vh - 85px);border:0}</style><pre id="trace">等待牌桌…</pre><iframe title="連續性測試遊戲" src="../index.html"></iframe><script>
const report={started:false,boards:0,flatFrames:0,openingFrames:0,dealingFrames:0,canvasChanges:0,phases:[]};let lastBoard,lastCanvas,lastPhase;const out=document.querySelector('#trace');const frame=document.querySelector('iframe');
function sample(){const d=frame.contentDocument,b=d?.querySelector('.immersive-table');if(b){const canvas=b.querySelector('.mahjong-canvas'),ready=b.classList.contains('three-table');if(ready){report.started=true;if(b!==lastBoard){report.boards++;lastBoard=b}if(lastCanvas&&canvas!==lastCanvas)report.canvasChanges++;lastCanvas=canvas;const phase=b.classList.contains('is-opening')?'opening':b.classList.contains('is-dealing')?'drawing':'playing';if(phase==='opening')report.openingFrames++;if(phase==='drawing')report.dealingFrames++;if(phase!==lastPhase){report.phases.push(phase);lastPhase=phase}}else if(report.started&&!b.classList.contains('three-loading'))report.flatFrames++;}out.textContent=JSON.stringify(report);requestAnimationFrame(sample)}frame.addEventListener('load',()=>requestAnimationFrame(sample),{once:true});
</script></html>
