<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V1.5 牌桌尺寸檢查</title><style>body{margin:0;background:#101f2a;color:#f3e5c7;font:14px sans-serif}nav{position:sticky;top:0;padding:12px;background:#101f2a;z-index:2;display:flex;gap:8px;flex-wrap:wrap}button{padding:8px 12px;background:#173b52;color:#f3e5c7;border:1px solid #c89a4e}iframe{display:block;border:2px solid #c89a4e;margin:10px auto;max-width:none}p{text-align:center}</style><nav aria-label="測試尺寸"><button data-size="1920,1080">1920 × 1080</button><button data-size="1440,900">1440 × 900</button><button data-size="1366,768">1366 × 768</button><button data-size="768,1024">768 × 1024</button><button data-size="390,844">390 × 844</button><button data-size="844,390">844 × 390</button><button data-size="667,375">667 × 375</button><button data-size="926,428">926 × 428</button></nav><p>實際遊戲尺寸測試。手機橫向放大手牌，直向以兩排顯示；主要動作依合法操作出現。</p><iframe title="遊戲尺寸測試" src="../index.html" width="1366" height="768"></iframe><script>document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{const [w,h]=b.dataset.size.split(',');const f=document.querySelector('iframe');f.width=w;f.height=h});</script></html>
